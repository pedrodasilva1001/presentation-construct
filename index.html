 atuação integra engenharia civil de precisão, planejamento físico-financeiro detalhado e acompanhamento técnico presencial em todas as frentes de trabalho. Cada residência é tratada como uma obra única, exigindo compatibilização criteriosa de projetos complementares antes do início de cada etapa no canteiro.","Do movimento de terra e fundações especiais até a instalação de caixilharias minimalistas, revestimentos naturais e sistemas de automação, mantemos padrões estritos de inspeção e controle de qualidade para assegurar desempenho construtivo, conforto térmico, acústico e durabilidade patrimonial."],mission:"Materializar projetos residenciais com excelência técnica, cumprimento rigoroso de planejamento e transparência absoluta em cada etapa da obra.",vision:"Ser referência em qualidade construtiva e gestão de engenharia residencial na região de [REGIÃO DE ATUAÇÃO — DADO PROVISÓRIO], reconhecida pela solidez técnica e pelo padrão de acabamento.",values:[{title:"Rigor Técnico e Normativo",description:"Execução fundamentada em projetos executivos compatibilizados, normas técnicas vigentes (ABNT) e controle tecnológico de materiais."},{title:"Transparência e Previsibilidade",description:"Orçamentos analíticos auditáveis, cronogramas reais e relatórios fotográficos e financeiros periódicos para o proprietário e arquitetos."},{title:"Fidelidade Arquitetônica",description:"Respeito integral às proporções, alinhamentos, paginações e especificações definidas pelos autores do projeto arquitetônico."},{title:"Responsabilidade e Segurança",description:"Canteiros limpos, organizados e seguros, com gestão rigorosa de equipes, fornecedores homologados e responsabilidade ambiental."}],whatsappNumber:"5500000000000",whatsappDisplay:"[ (00) 00000-0000 — WHATSAPP PROVISÓRIO ]",phoneDisplay:"[ (00) 0000-0000 — TELEFONE PROVISÓRIO ]",email:"contato@[suaconstrutora-provisorio].com.br",address:"[Av. / Rua Exemplo, nº 000, Sala 00 — Bairro, Cidade/UF — CEP 00000-000 (Provisório)]",serviceRegion:"[Cidade Sede e Condomínios da Região Metropolitana — DADO PROVISÓRIO]",businessHours:"Segunda a Sexta, das 08h às 18h (Atendimento técnico mediante agendamento)",socialLinks:{instagram:"https://instagram.com",linkedin:"https://linkedin.com",youtube:"https://youtube.com"},indicators:[{id:"ind-1",value:"[XX+]",label:"Anos de atuação em engenharia",note:"Dado provisório — editar no Painel Admin",isPlaceholder:!0},{id:"ind-2",value:"[XX]",label:"Obras residenciais executadas",note:"Dado provisório — editar no Painel Admin",isPlaceholder:!0},{id:"ind-3",value:"[XX.XXX]",unit:"m²",label:"Área total construída",note:"Dado provisório — editar no Painel Admin",isPlaceholder:!0},{id:"ind-4",value:"100%",label:"Obras com acompanhamento técnico dedicado",note:"Compromisso metodológico",isPlaceholder:!1}],showPlaceholderBadges:!0},projects:[{id:"proj-01",slug:"residencia-horizonte-concreto",title:"Residência Horizonte",subtitle:"Implantação em aclive com estrutura mista em concreto aparente e aço",code:"OBRA — 01 [DEMO]",category:"residencial",status:"concluido",featured:!0,location:"[Condomínio Residencial — Cidade, UF (Provisório)]",completionYear:"2024",areaSqm:645,lotAreaSqm:1250,floors:"2 Pavimentos + Subsolo Técnico",structuralSystem:"Concreto armado aparente e perfis metálicos em balanço",coverImage:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85",summary:"[PROJETO DEMONSTRATIVO] Residência unifamiliar contemporânea caracterizada por grandes vãos livres, lajes impermeabilizadas de cobertura plana e integração contínua entre o living social e a área externa.",description:["[TEXTO DEMONSTRATIVO DE OBRA] A Residência Horizonte foi concebida para tirar máximo proveito da topografia natural do lote e da orientação solar norte. A execução demandou contenções especiais em cortina de concreto armado e fundações profundas rigorosamente dimensionadas.","O pavimento social estrutura-se em um volume prismático com balanço estrutural de 6,5 metros, executado com fôrmas de compensado plastificado de alta densidade para garantir a textura monolítica do concreto aparente sem necessidade de revestimentos corretivos.","Toda a transição entre áreas internas e varanda gourmet é realizada por esquadrias piso-teto motorizadas com trilhos embutidos no contrapiso nivelado, exigindo tolerância milimétrica na execução das cotas de osso e impermeabilização."],architecturalDetails:["Balanço estrutural frontal de 6,50m em concreto armado protendido aparente.","Caixilharia minimalista em alumínio anodizado preto com folhas de correr embutidas e vidros laminados de controle solar.","Brises móveis em madeira Cumaru certificada na fachada íntima para controle de insolação oeste.","Cobertura plana com sistema de impermeabilização em manta asfáltica dupla camada e isolamento termoacústico em XPS."],finishingDetails:["Piso da área social e terraços em placas de pedra natural basalto levigado (1,20 x 1,20m) com juntas secas retificadas.","Forro em réguas de madeira freijó natural alinhado aos caixilhos e sancas negativas de iluminação linear.","Louças e metais de linha arquitetônica com registros monocomando embutidos e ralos lineares ocultos.","Infraestrutura completa de automação residencial, climatização VRF dutada e geração fotovoltaica integrada."],technicalSpecs:[{label:"Tipologia",value:"Residência Unifamiliar de Alto Padrão"},{label:"Área Construída",value:"645 m²"},{label:"Área do Terreno",value:"1.250 m²"},{label:"Sistema Construtivo",value:"Concreto Armado Aparente + Estrutura Metálica"},{label:"Prazo de Execução",value:"16 meses [Dado Demonstrativo]"},{label:"Projeto Arquitetônico",value:"[Escritório de Arquitetura Parceiro — Provisório]"}],gallery:[{id:"gal-101",url:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85",caption:"Vista principal da fachada voltada para o jardim e piscina em concreto.",aspect:"wide"},{id:"gal-102",url:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1400&q=85",caption:"Integração entre área social, caixilharia piso-teto e jardim interno.",aspect:"landscape"},{id:"gal-103",url:"https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=1400&q=85",caption:"Detalhe do encontro entre concreto aparente, madeira natural e iluminação indireta.",aspect:"landscape"},{id:"gal-104",url:"https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1400&q=85",caption:"Acabamento interno da sala de estar com paginação contínua de piso.",aspect:"landscape"}],createdAt:"2024-08-15T10:00:00Z",updatedAt:"2024-10-01T14:30:00Z"},{id:"proj-02",slug:"casa-patio-minimalista",title:"Casa Pátio & Pedra",subtitle:"Pavilhão térreo organizado ao redor de pátio central arborizado",code:"OBRA — 02 [DEMO]",category:"residencial",status:"concluido",featured:!0,location:"[Condomínio Fechado — Cidade, UF (Provisório)]",completionYear:"2024",areaSqm:490,lotAreaSqm:1e3,floors:"Pavimento Térreo Linear",structuralSystem:"Concreto armado, alvenaria estrutural racionalizada e pedra natural",coverImage:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=85",summary:"[PROJETO DEMONSTRATIVO] Arquitetura horizontal de linhas puras com empenas cegas em pedra natural, garantindo privacidade frontal e abertura total para o pátio central.",description:["[TEXTO DEMONSTRATIVO DE OBRA] Desenvolvida em um único nível principal para proporcionar acessibilidade plena e fluidez espacial, a Casa Pátio & Pedra organiza seus setores social, íntimo e de serviços em três alas conectadas por galerias envidraçadas.","O desafio construtivo concentrou-se no alinhamento rigoroso das platibandas metálicas delgadas com as paredes revestidas em pedra moledo assentada artesanalmente peça a peça pela equipe de acabamento.","O sistema de drenagem pluvial e as instalações de climatização foram integralmente embutidos em galerias técnicas visitáveis, preservando a pureza volumétrica das fachadas."],architecturalDetails:["Beirais esbeltos com estrutura metálica engastada na laje de concreto armado.","Pátio interno com iluminação zenital e ventilação cruzada permanente em todos os ambientes.","Empenas em pedra natural selecionada com assentamento de junta seca.","Esquadrias acústicas com persianas motorizadas integradas nos dormitórios."],finishingDetails:["Piso interno da ala íntima em assoalho de madeira engenheirada carvalho americano.","Bancadas da cozinha e espaço gourmet esculpidas em quartzito natural escovado.","Pintura mineral fosca de alta permeabilidade ao vapor nas alvenarias externas.","Piscina revestida em pedra vulcânica com borda infinita nivelada ao deck."],technicalSpecs:[{label:"Tipologia",value:"Residência Unifamiliar Térrea"},{label:"Área Construída",value:"490 m²"},{label:"Área do Terreno",value:"1.000 m²"},{label:"Sistema Construtivo",value:"Concreto Armado e Estrutura Metálica"},{label:"Prazo de Execução",value:"14 meses [Dado Demonstrativo]"},{label:"Projeto Arquitetônico",value:"[Escritório de Arquitetura Parceiro — Provisório]"}],gallery:[{id:"gal-201",url:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=85",caption:"Volumetria horizontal e espelho d’água junto à área de convivência.",aspect:"wide"},{id:"gal-202",url:"https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1400&q=85",caption:"Acesso principal com planos em concreto, pedra e paisagismo nativo.",aspect:"landscape"},{id:"gal-203",url:"https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1400&q=85",caption:"Cozinha integrada executada com marcenaria sob medida e ilha monolítica.",aspect:"landscape"}],createdAt:"2024-05-10T10:00:00Z",updatedAt:"2024-09-12T11:20:00Z"},{id:"proj-03",slug:"residencia-mirante-da-serra",title:"Residência Mirante da Serra",subtitle:"Obra residencial em terreno de topografia acentuada com vista panorâmica",code:"OBRA — 03 [DEMO]",category:"residencial",status:"em_andamento",featured:!0,location:"[Loteamento de Alto Padrão — Cidade, UF (Provisório)]",completionYear:"2025 (Previsão)",areaSqm:780,lotAreaSqm:1680,floors:"3 Níveis escalonados na topografia",structuralSystem:"Fundações em estacas hélice contínua + estrutura em concreto armado",progressPercentage:72,currentStage:"Fase de Acabamentos Finos, Caixilharia e Revestimentos",coverImage:"https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=1600&q=85",summary:"[PROJETO DEMONSTRATIVO — EM ANDAMENTO] Implantação escalonada em três cotas para mínima interferência no perfil natural do terreno, com estrutura em concreto protendido e amplos terraços em balanço.",description:["[TEXTO DEMONSTRATIVO DE OBRA EM ANDAMENTO] A Residência Mirante da Serra encontra-se atualmente na etapa de instalação de esquadrias especiais, assentamento de revestimentos de grande formato e montagem de infraestrutura de climatização e automação.","A etapa de fundações e superestrutura foi concluída rigorosamente dentro do cronograma físico-financeiro, superando o desnível natural de 9 metros por meio de muros de arrimo atirantados e lajes nervuradas protendidas.","O gerenciamento próximo junto aos projetistas de estrutura, luminotécnica e interiores garante que todas as esperas hidráulicas, elétricas e de dados estejam posicionadas com precisão antes do fechamento de forros."],architecturalDetails:["Implantação escalonada em três níveis acompanhando as curvas de nível originais.","Piscina suspensa em concreto armado com tratamento impermeabilizante cristalizante e manta estruturada.","Vãos livres de até 11 metros na sala principal vencidos com vigas faixa protendidas.","Galeria técnica subterrânea para casas de máquinas, reservatórios e sistemas de tratamento."],finishingDetails:["Revestimento de fachada em painéis arquitetônicos ventilados e concreto aparente hidrofugado.","Guarda-corpos em vidro
